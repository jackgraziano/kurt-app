[project]
name = "kurt-app"
version = "0.1.0"
description = "Plataforma local do Kurt: cadastro do sistema físico, linha do tempo e (depois) rodadas de projeção de curtailment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "duckdb>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kurt-app = "kurt_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kurt_app*"]

[tool.setuptools.package-data]
kurt_app = ["ufs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
